# Nginx INTERNO del contenedor frontend: sirve la SPA compilada y proxifica
# /api/* al servicio `backend` de la red interna de Docker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier ruta de React resuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No listar directorios ni servir archivos ocultos
    autoindex off;
    location ~ /\. {
        deny all;
    }
}
