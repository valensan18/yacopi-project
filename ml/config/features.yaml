# Lista explícita permitida (allowlist) de características del modelo.
# Fase 1: actualizada con cardinalidades y cobertura REALES del consolidado
# (7.709 predios). Nada es definitivo hasta la Fase 2 (auditoría de fuga y
# disponibilidad en inferencia).
features:
  allowed:
    - name: area_terreno_catastral_m2
      kind: numeric
      unit: m2
      notes: superficie catastral; 0 nulos; auditar efecto mecánico si y es por ha
    - name: area_zhf_m2
      kind: numeric
      unit: m2
      notes: AREA_TERRE; 15 nulos; difiere >5% de la catastral en 4.924 predios
    - name: area_construida_m2
      kind: numeric
      unit: m2
      notes: 3.033 predios > 0; usar con cautela si la etiqueta mezcla suelo+obra
    - name: destino_economico
      kind: categorical
      notes: "10 categorías (Agropecuario 6.746; Religioso 627; Habitacional 225; resto 111)"
    - name: tr_latitud
      kind: numeric
      notes: 15 nulos; 7.694 válidas en rango Colombia; auditar memorización espacial
    - name: tr_longitud
      kind: numeric
      notes: idem tr_latitud
    - name: zhf_codigo
      kind: categorical
      notes: 16 categorías
    - name: zhf_dispon
      kind: categorical
      notes: "4 categorías (4: 4.541; 3: 3.112; 2: 41; vacío: 15)"
    - name: zhf_influe
      kind: categorical
      notes: "4 categorías (5: 4.656; 3: 2.049; 8: 989; vacío: 15)"
    - name: zhf_uso_ac
      kind: categorical
      notes: "3 categorías (16: 7.474; 12: 220; vacío: 15)"
    - name: aht_vpoten
      kind: categorical
      notes: "16 categorías; 40 vacíos"
    - name: fa_element
      kind: categorical
      notes: "2 categorías; 471 vacíos (cobertura baja); decisión en Fase 2"
    - name: vus_vocaci
      kind: categorical
      notes: 9 categorías
    - name: ups
      kind: categorical
      notes: "4 categorías (19 vacíos)"
    - name: clc_nivel1
      kind: categorical
      notes: 7 categorías; N/A conservado como categoría
    - name: clc_nivel2
      kind: categorical
      notes: 13 categorías
    - name: clc_nivel3
      kind: categorical
      notes: 30 categorías
    - name: clc_nivel4
      kind: categorical
      notes: "28 categorías (N/A: 6.100)"
    - name: clc_nivel5
      kind: categorical
      notes: "11 categorías (N/A: 7.430)"
    - name: clc_nivel6
      kind: categorical
      notes: "4 categorías (N/A: 7.510)"

# Columnas PROHIBIDAS como X (fuga de la variable objetivo o derivadas de ella)
blocked:
  - numero_predial                  # identificador
  - numero_predial_anterior
  - codigo_orip
  - matricula_inmobiliaria
  - codigo_lote
  - valor_avaluo_total_cop          # objetivo potencial / precio
  - referencia_avaluo_total_por_ha_cop
  - valor_hectarea_agropecuario
  - ZHG_VALOR_
  - ZHG_VALOR1
  - referencia_zhg_valor_zhf_cop_ha
  - referencia_zhg_valor1_zhf_cop_ha
  - referencia_zhg_valor_ponderado_cop_ha
  - referencia_zhg_valor_predominante_cop_ha
  - zhg_codigo_predominante         # código geoeconómico
  - zhg_codigo_zhf
  - zhg_porcentaje_predominante
  - suma_porcentaje_intersecciones
  - suma_area_intersecciones_m2
  - razon_area_intersecciones_catastral
  - razon_area_zhf_catastral
  - razon_area_geo_zhg_zhf
  - zhg_subzona                     # contexto geográfico: solo evaluación estratificada
  - tr_este
  - tr_norte
  - geometria                       # geometrías crudas, nunca al estimador
  - geometria_interseccion
  - geom
