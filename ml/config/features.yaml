# Lista explícita permitida (allowlist) de características del modelo.
# BORRADOR para Fase 2 — nada de esto es definitivo hasta auditar cada
# columna en tiempo de inferencia, relación con la etiqueta y fuga.
features:
  allowed:
    - name: area_terreno_catastral_m2
      kind: numeric
      unit: m2
      notes: superficie catastral; revisar definición/fecha
    - name: area_zhf_m2
      kind: numeric
      unit: m2
      notes: AREA_TERRE de la segunda fuente; definición por validar
    - name: area_construida_m2
      kind: numeric
      unit: m2
      notes: superficie construida declarada
    - name: destino_economico
      kind: categorical
      notes: categorías como texto, nunca cantidad
    - name: tr_latitud
      kind: numeric
      notes: coordenada referencial ZHF; auditar exactitud y fuga espacial
    - name: tr_longitud
      kind: numeric
      notes: coordenada referencial ZHF
    - name: zhf_codigo
      kind: categorical
      notes: código ZHF
    - name: zhf_dispon
      kind: categorical
    - name: zhf_influe
      kind: categorical
    - name: zhf_uso_ac
      kind: categorical
    - name: aht_vpoten
      kind: categorical
    - name: vus_vocaci
      kind: categorical
    - name: ups
      kind: categorical
    - name: clc_nivel1
      kind: categorical
    - name: clc_nivel2
      kind: categorical
    - name: clc_nivel3
      kind: categorical
    - name: clc_nivel4
      kind: categorical
    - name: clc_nivel5
      kind: categorical
    - name: clc_nivel6
      kind: categorical

# Columnas PROHIBIDAS como X (fuga de la variable objetivo o derivadas de ella)
blocked:
  - numero_predial                  # identificador
  - numero_predial_anterior
  - codigo_orip
  - matricula_inmobiliaria
  - codigo_lote
  - valor_avaluo_total_cop          # objetivo potencial / precio
  - referencia_avaluo_total_por_ha_cop
  - valor_hectarea_agropecuario
  - ZHG_VALOR_
  - ZHG_VALOR1
  - referencia_zhg_valor_zhf_cop_ha
  - referencia_zhg_valor1_zhf_cop_ha
  - referencia_zhg_valor_ponderado_cop_ha
  - referencia_zhg_valor_predominante_cop_ha
  - zhg_codigo_predominante         # código geoeconómico
  - zhg_codigo_zhf
  - zhg_porcentaje_predominante
  - suma_porcentaje_intersecciones
  - suma_area_intersecciones_m2
  - razon_area_intersecciones_catastral
  - razon_area_zhf_catastral
  - razon_area_geo_zhg_zhf
  - zhg_subzona                     # contexto geográfico: solo evaluación estratificada
  - tr_este
  - tr_norte
  - geometria                       # geometrías crudas, nunca al estimador
  - geometria_interseccion
  - geom
